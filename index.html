<!DOCTYPE html>
<html>
<head>
    <title>SCAM SHIELD</title>
    <style>
        body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; padding-top: 50px; }
        .box { background: white; padding: 20px; border-radius: 10px; width: 400px; box-shadow: 0 0 10px gray; text-align: center; }
        textarea { width: 100%; height: 100px; margin-top: 10px; }
        button { width: 100%; padding: 10px; background: #0066ff; color: white; border: none; margin-top: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .scam { color: red; font-weight: bold; margin-top: 15px; }
        .safe { color: green; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🛡️ SCAM SHIELD</h1>
        <form method="POST">
            <textarea name="message" placeholder="Yaha message paste karo..."></textarea>
            <button type="submit">Check Karo</button>
        </form>
        {% if result %}
            {% if result.scam %}
                <h2 class="scam">⚠️ SCAM HAI! - {{ result.reason }}</h2>
            {% else %}
                <h2 class="safe">✅ SAFE HAI</h2>
            {% endif %}
        {% endif %}
    </div>
</body>
</html>
